name: Package iMedX Appendix
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: imedx-appendix
          path: tmp-transfer/iMedX_All_Live_Website_Screenshots_Appendix.docx
          if-no-files-found: error
